<h1>환불정책</h1>
<p>시행일: 2026-06-15</p>
<h2>1. 인앱결제 환불</h2>
<p>포인트 충전은 Apple App Store / Google Play의 인앱결제로 이루어지며, 환불은 각 스토어의 환불 정책·절차에 따릅니다. 스토어에서 환불이 승인되면 회사는 환불 알림(웹훅)을 받아 해당 거래를 환불 처리로 기록합니다.</p>

<h2>2. 포인트 사용·소멸</h2>
<p>이미 사용한 포인트(말걸기·보이스톡·아이템 등)는 환불되지 않습니다. 적립 포인트는 현금 가치가 없으며 환전·출금되지 않습니다.</p>
