<h2>요청 방법</h2>
<p>이메일: <b>(삭제요청 접수 이메일)</b> 로 가입 시 본인인증한 정보와 함께 "계정삭제 요청"을 보내주세요. 영업일 기준 7일 내 처리합니다.</p>
